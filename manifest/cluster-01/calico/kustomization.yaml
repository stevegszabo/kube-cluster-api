apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cluster-01

resources:
- clusterresourceset.yaml

# Calico for cluster-01 only: the CRS reaches clusters in this namespace, and
# CALICO_IPV4POOL_CIDR in calico-v3.32.2.yaml must match clusterNetwork.pods
# in ../cluster-01.yaml (10.243.0.0/16).
#
# Calico is ~350KB, over the client-side apply annotation limit.
# Apply with: kubectl apply --server-side -k manifest/cluster-01/calico
configMapGenerator:
- name: calico
  files:
  - calico.yaml=calico-v3.32.2.yaml
  options:
    disableNameSuffixHash: true
