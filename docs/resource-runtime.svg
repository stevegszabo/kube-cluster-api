<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="Runtime chain: the control plane and MachineDeployment create Machines, Machines create VirtualMachines, each VM clones its disk from the shared DataVolume and runs one node of the workload cluster. The ClusterResourceSet installs Calico into that cluster. The KubevirtCluster creates the cluster-01-lb Service, the API endpoint.">
  <title>Runtime chain: the control plane and MachineDeployment create Machines, Machines create VirtualMachines, each VM clones its disk from the shared DataVolume and runs one node of the workload cluster. The ClusterResourceSet installs Calico into that cluster. The KubevirtCluster creates the cluster-01-lb Service, the API endpoint.</title>
  <style>
svg { --plate:#ffffff; --fg:#18212c; --muted:#5a6676; --line:#a9b3c0; --hair:#dde2e8; --accent:#0d7680; --file:#eef2f1; }
@media (prefers-color-scheme: dark) {
  svg { --plate:#171d25; --fg:#e2e7ee; --muted:#97a2b1; --line:#556170; --hair:#2a323d; --accent:#4cc1c9; --file:#1c2527; }
}
.bg { fill: var(--plate); }
.bx { fill: var(--plate); stroke: var(--line); stroke-width: 1.2; }
.bx.rt { stroke-dasharray: 5 3; }
.bx.ext { stroke-dasharray: 1.5 3; }
.bx.file { fill: var(--file); }
.fr { fill: none; stroke: var(--hair); stroke-width: 1.2; }
.k { font: 500 10px "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.06em; fill: var(--muted); }
.n { font: 500 12px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; fill: var(--fg); }
.n.plain { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; }
.el { font: 400 11px "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
.el.acc { fill: var(--accent); }
.fl { font: 600 10px "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.08em; fill: var(--muted); }
.note { font: 400 11px "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
.e { fill: none; stroke: var(--line); stroke-width: 1.3; }
.e.sel { stroke: var(--accent); stroke-dasharray: 6 4; }
.e.mk { stroke-dasharray: 5 4; }
.e.bld { stroke-dasharray: 2 4; stroke-linecap: round; }
.ah { fill: var(--line); }
.ah.acc { fill: var(--accent); }
  </style>
  <rect class="bg" width="1000" height="490" rx="8"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah acc" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="fr" x="800" y="12" width="190" height="322" rx="10"/>
  <text class="fl" x="812" y="33">WORKLOAD CLUSTER</text>

  <!-- r0: control plane chain -->
  <rect class="bx" x="20" y="50" width="200" height="54" rx="6"/>
  <text class="k" x="32" y="70">KUBEADMCONTROLPLANE</text><text class="n" x="32" y="90">cluster-01-control</text>
  <rect class="bx rt" x="290" y="50" width="200" height="54" rx="6"/>
  <text class="k" x="302" y="70">MACHINE</text><text class="n" x="302" y="90">cluster-01-control-…</text>
  <rect class="bx rt" x="560" y="50" width="200" height="54" rx="6"/>
  <text class="k" x="572" y="70">VIRTUALMACHINE</text><text class="n" x="572" y="90">cluster-01-control-…</text>
  <rect class="bx rt" x="810" y="50" width="170" height="54" rx="6"/>
  <text class="k" x="822" y="70">NODE</text><text class="n plain" x="822" y="90">control plane</text>

  <!-- r1: image and Calico -->
  <rect class="bx" x="20" y="160" width="200" height="54" rx="6"/>
  <text class="k" x="32" y="180">MACHINEHEALTHCHECK</text><text class="n" x="32" y="200">cluster-01-worker</text>
  <rect class="bx ext" x="290" y="160" width="200" height="54" rx="6"/>
  <text class="k" x="302" y="180">REGISTRY</text><text class="n" x="302" y="200">quay.io/capk</text>
  <rect class="bx" x="560" y="160" width="200" height="54" rx="6"/>
  <text class="k" x="572" y="180">DATAVOLUME · CAPK-IMAGES</text><text class="n" x="572" y="200">ubuntu-2404-v1-34-1</text>
  <rect class="bx rt" x="810" y="160" width="170" height="54" rx="6"/>
  <text class="k" x="822" y="180">CALICO V3.32.2</text><text class="n plain" x="822" y="200">on both nodes</text>

  <!-- r2: worker chain -->
  <rect class="bx" x="20" y="270" width="200" height="54" rx="6"/>
  <text class="k" x="32" y="290">MACHINEDEPLOYMENT</text><text class="n" x="32" y="310">cluster-01-worker</text>
  <rect class="bx rt" x="290" y="270" width="200" height="54" rx="6"/>
  <text class="k" x="302" y="290">MACHINE · VIA MACHINESET</text><text class="n" x="302" y="310">cluster-01-worker-…</text>
  <rect class="bx rt" x="560" y="270" width="200" height="54" rx="6"/>
  <text class="k" x="572" y="290">VIRTUALMACHINE</text><text class="n" x="572" y="310">cluster-01-worker-…</text>
  <rect class="bx rt" x="810" y="270" width="170" height="54" rx="6"/>
  <text class="k" x="822" y="290">NODE</text><text class="n plain" x="822" y="310">worker</text>

  <!-- r3: endpoint, credentials, addon -->
  <rect class="bx" x="20" y="400" width="200" height="54" rx="6"/>
  <text class="k" x="32" y="420">KUBEVIRTCLUSTER</text><text class="n" x="32" y="440">cluster-01</text>
  <rect class="bx rt" x="290" y="400" width="200" height="54" rx="6"/>
  <text class="k" x="302" y="420">SERVICE · CLUSTERIP</text><text class="n" x="302" y="440">cluster-01-lb</text>
  <text class="note" x="390" y="472" text-anchor="middle">the cluster's API endpoint</text>
  <rect class="bx rt" x="560" y="400" width="200" height="54" rx="6"/>
  <text class="k" x="572" y="420">SECRET</text><text class="n" x="572" y="440">cluster-01-kubeconfig</text>
  <text class="note" x="660" y="472" text-anchor="middle">read by make kubeconfig</text>
  <rect class="bx" x="800" y="400" width="190" height="54" rx="6"/>
  <text class="k" x="812" y="420">CLUSTERRESOURCESET</text><text class="n" x="812" y="440">calico</text>

  <!-- edges -->
  <line class="e mk" x1="220" y1="77" x2="287" y2="77" marker-end="url(#a2)"/>
  <text class="el" x="254" y="69" text-anchor="middle">creates</text>
  <line class="e mk" x1="490" y1="77" x2="557" y2="77" marker-end="url(#a2)"/>
  <text class="el" x="524" y="69" text-anchor="middle">creates</text>
  <line class="e mk" x1="760" y1="77" x2="807" y2="77" marker-end="url(#a2)"/>
  <text class="el" x="784" y="69" text-anchor="middle">runs</text>

  <line class="e mk" x1="220" y1="297" x2="287" y2="297" marker-end="url(#a2)"/>
  <text class="el" x="254" y="289" text-anchor="middle">creates</text>
  <line class="e mk" x1="490" y1="297" x2="557" y2="297" marker-end="url(#a2)"/>
  <text class="el" x="524" y="289" text-anchor="middle">creates</text>
  <line class="e mk" x1="760" y1="297" x2="807" y2="297" marker-end="url(#a2)"/>
  <text class="el" x="784" y="289" text-anchor="middle">runs</text>

  <line class="e mk" x1="490" y1="187" x2="557" y2="187" marker-end="url(#a2)"/>
  <text class="el" x="524" y="179" text-anchor="middle">imports</text>
  <line class="e mk" x1="660" y1="160" x2="660" y2="107" marker-end="url(#a2)"/>
  <text class="el" x="668" y="138">clones disk</text>
  <line class="e mk" x1="660" y1="214" x2="660" y2="267" marker-end="url(#a2)"/>
  <text class="el" x="668" y="246">clones disk</text>

  <line class="e sel" x1="205" y1="214" x2="318" y2="268" marker-end="url(#a2s)"/>
  <text class="el acc" x="276" y="252" text-anchor="end">watches</text>

  <line class="e mk" x1="220" y1="427" x2="287" y2="427" marker-end="url(#a2)"/>
  <text class="el" x="254" y="419" text-anchor="middle">creates</text>
  <line class="e mk" x1="895" y1="400" x2="895" y2="337" marker-end="url(#a2)"/>
  <text class="el" x="887" y="373" text-anchor="end">installs</text>
</svg>
